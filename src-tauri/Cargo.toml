[package]
name = "estudo-ia-local"
version = "0.1.0"
description = "Aplicativo local-first de estudos com IA local"
authors = ["Roniclei"]
edition = "2021"

[lib]
name = "estudo_ia_local_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["tauri-app"]
tauri-app = ["dep:tauri"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
lopdf = "0.34"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [], optional = true }
tauri-plugin-dialog = "2"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[dev-dependencies]
tempfile = "3"
